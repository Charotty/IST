# Multilevel thesis tuning: fast → refine → confirm
# Used by orchestration/thesis_tuning.py

levels:
  fast:
    max_rows: 6000
    max_wfo_folds: 8
    walk_forward_step: 500
    dl_epochs: 2
    dl_batch_size: 128
    # GTX 1660 Ti + cuDNN 9.3: f16 Conv1D autotune mismatch — только GRU (см. model_factory)
    mixed_precision: true
    cnn_mixed_precision: false
    n_trials: 24
    pruner: median
    pruner_min_completed_trials: 5
    tabular_profile: fast
  refine:
    max_rows: 8000
    max_wfo_folds: 12
    walk_forward_step: 400
    dl_epochs: 2
    dl_batch_size: 128
    mixed_precision: true
    cnn_mixed_precision: false
    n_trials: 12
    pruner: median
    pruner_min_completed_trials: 3
    tabular_profile: fast
    seed_from: fast_shortlist
  confirm:
    max_rows: 8000
    max_wfo_folds: 0
    walk_forward_step: 360
    dl_epochs: 3
    dl_batch_size: 64
    mixed_precision: false
    n_trials: 3
    pruner: none
    tabular_profile: confirm
    seed_from: refine_best

top_k: 5
tabular_first_fast_refine: false

tabular_accel:
  lightgbm:
    num_threads: -1
    max_bin: 63
    device_type: cpu
    n_estimators_fast: 100
    n_estimators_confirm: 200
  xgboost:
    tree_method: hist
    device: cuda
    n_estimators_fast: 100
    n_estimators_confirm: 200
