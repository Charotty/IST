# Intelligent Trading System Configuration

app:
  name: "Intelligent Trading System"
  version: "1.0.0"
  debug: true
  log_level: "INFO"

# Data Layer Configuration
data_layer:
  connectors:
    okx:
      api_key: "${OKX_API_KEY}"
      secret_key: "${OKX_SECRET_KEY}"
      passphrase: "${OKX_PASSPHRASE}"
      sandbox: true
      rate_limit: 20
      base_url: "https://www.okx.cab/api/v5"
  
  storage:
    parquet:
      path: "./data/parquet"
      compression: "snappy"
  
  streaming:
    buffer_size: 10000
    batch_size: 100
    flush_interval: 5

# Synchronization Layer Configuration
synchronization:
  base_timestep: "1s"
  max_gap_size: 5
  
  ohlcv:
    ohlcv_method: "standard"
  
  trades:
    aggregation_method: "vwap"
    min_trade_size: 0.001
  
  orderbook:
    depth: 5
    calculate_spreads: true
    calculate_imbalance: true
  
  gap_handling:
    method: "adaptive"
    max_gap_size: 60
    forward_fill_threshold: 5
    linear_threshold: 30

# Aggregation Configuration
aggregation:
  base_timestep: "1s"
  aggregation_method: "standard"
  max_buffer_size: 10000

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    console:
      enabled: true
      level: "INFO"
    file:
      enabled: true
      level: "DEBUG"
      filename: "trading_system.log"
      max_size: "10MB"
      backup_count: 5
