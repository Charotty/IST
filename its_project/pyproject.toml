[tool.pytest.ini_options]
# Pytest configuration (alternative to pytest.ini)
minversion = "6.0"
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
# Coverage configuration
source = ["its_project"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
    "*/gui/*",  # GUI tests handled separately
]
branch = true

[tool.coverage.report]
# Coverage report settings
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
# HTML coverage report
directory = "htmlcov"

[tool.coverage.xml]
# XML coverage report (for CI/CD)
output = "coverage.xml"
