# ITS Configuration

# Database Configuration
database:
  timescale_dsn: "postgresql://user:pass@localhost/its"
  parquet_path: "data/parquet"
  enable_compression: true
  retention_policy: "30 days"

# Trading Configuration
trading:
  initial_balance: 10000.0
  commission_rate: 0.001
  max_position_size: 0.1
  slippage_model: "linear"
  slippage_params:
    base_rate: 0.0001
    size_factor: 0.000001

# Data Sources Configuration
data_sources:
  # OKX Exchange
  okx:
    enabled: true
    type: "websocket"
    websocket_url: "wss://ws.okx.com:8443/ws/v5/public"
    rest_url: "https://www.okx.com"
    symbols:
      - "BTC/USDT"
      - "ETH/USDT"
      - "BNB/USDT"
      - "SOL/USDT"
    subscriptions:
      - "tickers"
      - "orderbook"
      - "candles"
    rate_limit:
      requests_per_second: 10
      burst_size: 5
      enable_exponential_backoff: true
      max_backoff_seconds: 60
  
  # CCXT Multi-Exchange
  ccxt:
    enabled: true
    exchanges:
      binance:
        enabled: true
        api_key: ""
        secret: ""
        symbols:
          - "BTC/USDT"
          - "ETH/USDT"
      bybit:
        enabled: false
        api_key: ""
        secret: ""
        symbols:
          - "BTC/USDT"
    rate_limit:
      requests_per_second: 5
      burst_size: 3

# Model Configuration
models:
  default_model: "GRU-LSTM"
  model_weights: [0.4, 0.3, 0.3]
  
  # Regression Model for ΔP_hat
  regression:
    model_type: "gradient_boosting"  # "linear" or "gradient_boosting"
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42
  
  # Auto-retrain Configuration
  auto_retrain:
    enabled: true
    retrain_interval_hours: 24.0
    min_samples_for_retrain: 1000
    performance_threshold: 0.5
    retrain_on_degradation: true
    degradation_threshold: 0.1

# Feature Engineering Configuration
features:
  technical_indicators:
    - "rsi"
    - "macd"
    - "bbands"
    - "atr"
    - "stoch"
    - "sma"
    - "ema"
  
  indicator_params:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bb_period: 20
    bb_std: 2.0
    atr_period: 14
    stoch_k: 14
    stoch_d: 3
    sma_period: 20
    ema_period: 20
  
  synchronization:
    freq: "1s"
    method: "ffill"
    max_gap: "5s"
    lookback_window: "5min"

# Decision Layer Configuration
decision:
  threshold_strategy: "adaptive"  # "fixed", "adaptive", "volatility_adjusted"
  fixed_threshold: 0.7
  adaptive_window: 100
  min_signal_strength: 0.1
  signal_smoothing: false
  smoothing_window: 5

# Backtesting Configuration
backtesting:
  commission_rate: 0.001
  slippage_model: "linear"
  slippage_params:
    base_rate: 0.0001
    size_factor: 0.000001
  walk_forward_windows: 5
  validation_ratio: 0.2

# Telegram Bot Configuration
telegram:
  enabled: false
  token: ""
  chat_id: ""
  notifications: true
  commands: true
  whitelist: []
  require_whitelist: false

# GUI Configuration
gui:
  enabled: true
  theme: "dark"
  update_interval_ms: 1000
  max_history_entries: 50

# Pipeline Orchestrator Configuration
orchestrator:
  loop_interval_ms: 1000
  max_retries: 3
  enable_paper_trading: true

# Logging Configuration
logging:
  level: "INFO"
  file: "logs/system.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5