[pytest]
# Pytest configuration for ITS project

# Test discovery patterns
python_files = test_*.py *_test.py verify_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Async support
asyncio_mode = auto

# Coverage configuration
addopts =
    --verbose
    --strict-markers
    --cov=its_project
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --cov-config=pyproject.toml

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests between components
    e2e: End-to-end tests
    slow: Slow running tests
    fast: Fast running tests
    data_layer: Tests for Data Layer
    storage_layer: Tests for Storage Layer
    preprocessing_layer: Tests for Preprocessing Layer
    features_layer: Tests for Feature Engineering Layer
    models_layer: Tests for Model Layer
    metalearning_layer: Tests for Meta-Learning Layer
    decision_layer: Tests for Decision Layer
    execution_layer: Tests for Execution Layer
    interface_layer: Tests for Interface Layer
    backtesting_layer: Tests for Backtesting Layer
    security: Security tests
    performance: Performance tests
    manual: Tests requiring manual verification

# Warning settings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::RuntimeWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests
timeout = 300

# Parallel execution (requires pytest-xdist)
# Use: pytest -n auto
# Disabled by default, enable with -n flag
