<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - ITS Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>Portfolio Overview</h1>
            <div class="system-status" id="systemStatus">
                <span class="status-indicator"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="dashboard-nav">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/orders" class="nav-link">Orders</a>
            <a href="/portfolio" class="nav-link active">Portfolio</a>
        </nav>

        <!-- Main Content -->
        <main class="dashboard-content">
            <!-- Portfolio Summary -->
            <div class="price-cards">
                <div class="price-card">
                    <h3>Total Value</h3>
                    <div class="price-value" id="totalValue">$0.00</div>
                    <div class="price-change" id="dailyPnl">$0.00 (0%)</div>
                </div>
                <div class="price-card">
                    <h3>Total PnL</h3>
                    <div class="price-value" id="totalPnl">$0.00</div>
                    <div class="price-change" id="pnlPercentage">0%</div>
                </div>
                <div class="price-card">
                    <h3>Available Balance</h3>
                    <div class="price-value" id="availableBalance">$0.00</div>
                    <div class="price-change">USDT</div>
                </div>
            </div>

            <!-- Portfolio Chart -->
            <div class="chart-container" style="margin-bottom: 30px;">
                <h2>Portfolio Value Over Time</h2>
                <canvas id="portfolioChart"></canvas>
            </div>

            <!-- Positions Table -->
            <div class="activity-section">
                <h2>Current Positions</h2>
                <div class="orders-table-container">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Asset</th>
                                <th>Side</th>
                                <th>Size</th>
                                <th>Entry Price</th>
                                <th>Current Price</th>
                                <th>Value</th>
                                <th>PnL</th>
                            </tr>
                        </thead>
                        <tbody id="positionsTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center;">Loading positions...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let socket;
        let portfolioChart;
        let portfolioHistory = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeSocket();
            initializeChart();
            loadPortfolio();
        });
        
        function initializeSocket() {
            socket = io();
            
            socket.on('connect', function() {
                updateSystemStatus('connected', 'Connected');
            });
            
            socket.on('portfolio_update', function(data) {
                updatePortfolio(data);
            });
        }
        
        function initializeChart() {
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            portfolioChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Portfolio Value',
                        data: [],
                        borderColor: '#00d9ff',
                        backgroundColor: 'rgba(0, 217, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: 'rgba(255, 255, 255, 0.8)' }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        }
                    }
                }
            });
        }
        
        async function loadPortfolio() {
            try {
                const response = await fetch('/api/portfolio');
                const portfolio = await response.json();
                updatePortfolio(portfolio);
            } catch (error) {
                console.error('Error loading portfolio:', error);
            }
        }
        
        function updatePortfolio(portfolio) {
            // Update summary cards
            document.getElementById('totalValue').textContent = `$${(portfolio.total_value || 0).toFixed(2)}`;
            document.getElementById('totalPnl').textContent = `$${(portfolio.pnl || 0).toFixed(2)}`;
            document.getElementById('pnlPercentage').textContent = `${(portfolio.pnl / portfolio.total_value * 100).toFixed(2)}%`;
            document.getElementById('dailyPnl').textContent = `$${(portfolio.daily_pnl || 0).toFixed(2)} (${(portfolio.daily_pnl / portfolio.total_value * 100).toFixed(2)}%)`;
            
            // Update chart
            const now = new Date();
            portfolioChart.data.labels.push(now.toLocaleTimeString());
            portfolioChart.data.datasets[0].data.push(portfolio.total_value || 0);
            
            if (portfolioChart.data.labels.length > 20) {
                portfolioChart.data.labels.shift();
                portfolioChart.data.datasets[0].data.shift();
            }
            
            portfolioChart.update('none');
            
            // Update positions table
            const tbody = document.getElementById('positionsTableBody');
            tbody.innerHTML = '';
            
            const positions = portfolio.positions || [];
            if (positions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No open positions</td></tr>';
                return;
            }
            
            positions.forEach(position => {
                const row = document.createElement('tr');
                const pnl = (position.current_price - position.entry_price) * position.size;
                
                row.innerHTML = `
                    <td>${position.symbol || 'N/A'}</td>
                    <td>${position.side || 'N/A'}</td>
                    <td>${position.size || 0}</td>
                    <td>$${(position.entry_price || 0).toFixed(2)}</td>
                    <td>$${(position.current_price || 0).toFixed(2)}</td>
                    <td>$${(position.value || 0).toFixed(2)}</td>
                    <td class="${pnl >= 0 ? 'positive' : 'negative'}">$${pnl.toFixed(2)}</td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        function updateSystemStatus(status, message) {
            const indicator = document.querySelector('.status-indicator');
            const text = document.querySelector('.status-text');
            
            if (status === 'connected') {
                indicator.classList.add('healthy');
                text.textContent = message;
            } else {
                indicator.classList.remove('healthy');
                text.textContent = message;
            }
        }
    </script>
    
    <style>
        .positive {
            color: #00ff88;
        }
        
        .negative {
            color: #ff4444;
        }
    </style>
</body>
</html>
