<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - ITS Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>Orders Monitor</h1>
            <div class="system-status" id="systemStatus">
                <span class="status-indicator"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="dashboard-nav">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/orders" class="nav-link active">Orders</a>
            <a href="/portfolio" class="nav-link">Portfolio</a>
        </nav>

        <!-- Main Content -->
        <main class="dashboard-content">
            <!-- Order Statistics -->
            <div class="stats-row">
                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <div class="stat-value" id="totalOrders">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <div class="stat-value" id="pendingOrders">0</div>
                </div>
                <div class="stat-card">
                    <h3>Filled</h3>
                    <div class="stat-value" id="filledOrders">0</div>
                </div>
                <div class="stat-card">
                    <h3>Cancelled</h3>
                    <div class="stat-value" id="cancelledOrders">0</div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="activity-section">
                <h2>Recent Orders</h2>
                <div class="orders-table-container">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Symbol</th>
                                <th>Type</th>
                                <th>Side</th>
                                <th>Amount</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr>
                                <td colspan="8" style="text-align: center;">Loading orders...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let socket;
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeSocket();
            loadOrders();
        });
        
        function initializeSocket() {
            socket = io();
            
            socket.on('connect', function() {
                updateSystemStatus('connected', 'Connected');
            });
            
            socket.on('orders_update', function(data) {
                updateOrdersTable(data);
            });
        }
        
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                updateOrdersTable(orders);
            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }
        
        function updateOrdersTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';
            
            let stats = { total: 0, pending: 0, filled: 0, cancelled: 0 };
            
            orders.forEach(order => {
                stats.total++;
                if (order.status === 'pending') stats.pending++;
                if (order.status === 'filled') stats.filled++;
                if (order.status === 'cancelled') stats.cancelled++;
                
                const row = document.createElement('tr');
                const timestamp = new Date(order.dashboard_timestamp || Date.now());
                
                row.innerHTML = `
                    <td>${order.id || 'N/A'}</td>
                    <td>${order.symbol || 'N/A'}</td>
                    <td>${order.type || 'N/A'}</td>
                    <td>${order.side || 'N/A'}</td>
                    <td>${order.amount || 0}</td>
                    <td>${order.price ? order.price.toFixed(2) : 'N/A'}</td>
                    <td><span class="status-badge status-${order.status}">${order.status || 'Unknown'}</span></td>
                    <td>${timestamp.toLocaleTimeString()}</td>
                `;
                
                tbody.appendChild(row);
            });
            
            // Update statistics
            document.getElementById('totalOrders').textContent = stats.total;
            document.getElementById('pendingOrders').textContent = stats.pending;
            document.getElementById('filledOrders').textContent = stats.filled;
            document.getElementById('cancelledOrders').textContent = stats.cancelled;
        }
        
        function updateSystemStatus(status, message) {
            const indicator = document.querySelector('.status-indicator');
            const text = document.querySelector('.status-text');
            
            if (status === 'connected') {
                indicator.classList.add('healthy');
                text.textContent = message;
            } else {
                indicator.classList.remove('healthy');
                text.textContent = message;
            }
        }
    </script>
    
    <style>
        .orders-table-container {
            overflow-x: auto;
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .orders-table th,
        .orders-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .orders-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .orders-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .status-filled {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        
        .status-cancelled {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }
    </style>
</body>
</html>
