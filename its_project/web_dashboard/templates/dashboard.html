<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS Dashboard - Intelligent Trading System</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>Intelligent Trading System</h1>
            <div class="system-status" id="systemStatus">
                <span class="status-indicator"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="dashboard-nav">
            <a href="/" class="nav-link active">Dashboard</a>
            <a href="/orders" class="nav-link">Orders</a>
            <a href="/portfolio" class="nav-link">Portfolio</a>
        </nav>

        <!-- Main Content -->
        <main class="dashboard-content">
            <!-- Price Cards -->
            <div class="price-cards">
                <div class="price-card" id="btc-card">
                    <h3>BTC/USDT</h3>
                    <div class="price-value" id="btc-price">--</div>
                    <div class="price-change" id="btc-change">--</div>
                </div>
                <div class="price-card" id="eth-card">
                    <h3>ETH/USDT</h3>
                    <div class="price-value" id="eth-price">--</div>
                    <div class="price-change" id="eth-change">--</div>
                </div>
                <div class="price-card" id="bnb-card">
                    <h3>BNB/USDT</h3>
                    <div class="price-value" id="bnb-price">--</div>
                    <div class="price-change" id="bnb-change">--</div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="charts-row">
                <div class="chart-container">
                    <h2>Portfolio Value</h2>
                    <canvas id="portfolioChart"></canvas>
                </div>
                <div class="chart-container">
                    <h2>Performance Metrics</h2>
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-card">
                    <h3>Total Trades</h3>
                    <div class="stat-value" id="totalTrades">0</div>
                </div>
                <div class="stat-card">
                    <h3>Win Rate</h3>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
                <div class="stat-card">
                    <h3>Sharpe Ratio</h3>
                    <div class="stat-value" id="sharpeRatio">0.00</div>
                </div>
                <div class="stat-card">
                    <h3>Max Drawdown</h3>
                    <div class="stat-value" id="maxDrawdown">0%</div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="activity-section">
                <h2>Recent Activity</h2>
                <div class="activity-list" id="activityList">
                    <div class="activity-item">Waiting for data...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
